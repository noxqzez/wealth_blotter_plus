# Minimal demo task for hello_writer.

say_hello:
  description: >
    Write exactly two lines and nothing else.
    Line 1: Hello world
    Line 2: I am the Friendly Greeter agent (hello_writer).
  agent: hello_writer
  expected_output: >
    Two lines: "Hello world" then the agent identity line naming Friendly Greeter / hello_writer.
  async_execution: false
