<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wealth Blotter Plus</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root {
        color-scheme: light;
        --navy: #0b1f33;
        --navy-mid: #1f4e79;
        --blue: #0b5cab;
        --blue-hover: #094d91;
        --danger: #a4262c;
        --danger-hover: #8a1f24;
        --surface: #f3f6f9;
        --border: #d5dee7;
        --muted: #5a6b7d;
        --warn-bg: #fff4ce;
        --warn-border: #c19c00;
        --err-bg: #fde7e9;
        --err-border: #a4262c;
        --info-bg: #e8f1fb;
        --info-border: #0b5cab;
        --assistant-bg: #eef3f8;
        --user-bg: #d6e6f5;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 100vh;
      }
      #transcript {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 120px;
      }
      .bubble {
        max-width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: var(--assistant-bg);
        border: 1px solid var(--border);
        color: var(--navy);
        white-space: normal;
      }
      .bubble.assistant .bubble-body code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
      }
      .bubble.assistant .bubble-body strong {
        font-weight: 700;
      }
      .bubble.user {
        align-self: flex-end;
        background: var(--user-bg);
        border: 1px solid #b7cbe0;
        color: var(--navy);
      }
      .bubble .role {
        display: block;
        font-size: 10px;
        font-weight: 650;
        color: var(--muted);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .pane-footer {
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        padding: 10px 14px 12px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 0;
      }
      .badge-row:empty { display: none; }
      .exec-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--navy-mid);
        font-size: 11px;
        font-weight: 600;
      }
      .exec-badge.pulse {
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .guardrails {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .guardrails:empty { display: none; }
      .guard {
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid;
        font-size: 12px;
      }
      .guard.info {
        background: var(--info-bg);
        border-color: var(--info-border);
        color: var(--navy);
      }
      .guard.warning {
        background: var(--warn-bg);
        border-color: var(--warn-border);
        color: #5c4800;
      }
      .guard.blocking_error {
        background: var(--err-bg);
        border-color: var(--err-border);
        color: var(--danger);
      }
      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .action-row:empty { display: none; }
      button {
        margin: 0;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: var(--blue);
        color: #ffffff;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }
      button:disabled {
        background: #9aa7b5;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        background: var(--blue-hover);
      }
      button.secondary {
        background: var(--navy-mid);
      }
      button.secondary:not(:disabled):hover {
        background: #173a5a;
      }
      button.danger {
        background: var(--danger);
      }
      button.danger:not(:disabled):hover {
        background: var(--danger-hover);
      }
      #composer {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      #composer.hidden {
        display: none;
      }
      #userText {
        flex: 1;
        min-height: 56px;
        max-height: 120px;
        resize: vertical;
        padding: 8px;
        border: 1px solid #c5d0dc;
        border-radius: 6px;
        font: inherit;
        color: #111111;
        background: #ffffff;
      }
      #userText:disabled {
        background: var(--surface);
        color: var(--muted);
      }
      #sendBtn {
        flex-shrink: 0;
        align-self: stretch;
        min-width: 64px;
      }
      #status {
        margin: 0;
        min-height: 1.2em;
        color: var(--muted);
        font-size: 12px;
      }
      #status.error {
        color: var(--danger);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="transcript" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="pane-footer">
        <div id="statusBadges" class="badge-row" aria-live="polite"></div>
        <div id="guardrails" class="guardrails"></div>
        <div id="actions" class="action-row"></div>
        <div id="composer" class="hidden">
          <textarea
            id="userText"
            rows="2"
            maxlength="1000"
            placeholder="Type a message…"
            disabled
          ></textarea>
          <button id="sendBtn" type="button" disabled>Send</button>
        </div>
        <p id="status" aria-live="polite"></p>
      </div>
    </div>
    <script type="module" src="/src/taskpane.ts"></script>
  </body>
</html>
