[project]
name = "wealth-blotter-plus"
version = "0.1.0"
description = "Institutional wealth advisory platform — FastAPI, CrewAI, Supabase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "supabase>=2.10.0",
    "crewai>=0.80.0",
    "bleach>=6.2.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.40.0",
    "yfinance>=0.2.40",
    "python-multipart>=0.0.12",
    # WF-02 scenario: risk / Black–Litterman / optimizer / PDF
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "cvxpy>=1.5.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
rag = [
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
