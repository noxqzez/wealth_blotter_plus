# Render Blueprint — env *names* only. Set real values in the Render dashboard.
# Never commit secrets. Do not put pilot LLM keys here.
#
# https://render.com/docs/blueprint-spec
#
# After first deploy, set API CORS_ORIGINS to include the Static Site origin, e.g.:
#   https://localhost:3000,https://wealth-blotter-plus-excel.onrender.com

services:
  - type: web
    name: wealth-blotter-plus-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: REQUIRE_BYOK
        value: "true"
      - key: REQUIRE_PILOT_APPROVAL
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_AUDIENCE
        value: authenticated
      # LLM provider is chosen per request (Excel BYOK: openai | anthropic).
      # Do not put pilot API keys here. Server LLM_PROVIDER is unused in pilot mode.
      - key: USE_CLOUD_LLM
        value: "false"
      - key: CONFIDENCE_THRESHOLD
        value: "0.85"
      # SSO built but disabled — do not enable until IdP is ready.
      - key: SSO_ENABLED
        value: "false"
      - key: SSO_REQUIRE_APPROVAL
        value: "true"
      - key: SSO_PROVIDERS
        value: ""
      - key: SSO_AUTO_APPROVE_DOMAINS
        value: ""
      # Host approve + welcome email (/admin/pilots). Set secrets in Render dashboard.
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PILOT_WELCOME_FROM_EMAIL
        sync: false
      # Leave empty: attach gitignored manifest.pilot.LIVE.xml in welcome email.
      # Do not point at Static Site …/manifest.pilot.xml (placeholders when public-ready).
      - key: PILOT_MANIFEST_URL
        value: ""
      - key: PILOT_EXCEL_BASE_URL
        value: https://wealth-blotter-plus-excel.onrender.com

  # Excel task pane. Pilots sideload LIVE manifest from email, not placeholder XML.
  - type: web
    name: wealth-blotter-plus-excel
    runtime: static
    rootDir: frontend_excel
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://wealth-blotter-plus.onrender.com

